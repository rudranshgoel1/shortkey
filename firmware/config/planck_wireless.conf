# ---- Wireless ----
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y   # stronger BLE signal

# ---- Power saving (battery) ----
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000   # deep sleep after 15 min idle

# ---- Per-key RGB (48x SK6812mini-e) ----
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20    # start dim
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=40      # cap brightness (see README: LED current)
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y # lights off when idle
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y  # lights off when USB is unplugged/suspended

# ---- 0.91" OLED ----
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y  # use src/custom_status_screen.c
CONFIG_LV_FONT_UNSCII_8=y                  # small 8px font used by the sample screen
